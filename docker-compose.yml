services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tableorder-network

  customer-api:
    build:
      context: .
      dockerfile: customer-api/Dockerfile
    ports:
      - "${CUSTOMER_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - tableorder-network

  customer-web:
    build:
      context: ./customer-web
    ports:
      - "${CUSTOMER_WEB_PORT:-3001}:80"
    depends_on:
      - customer-api
    networks:
      - tableorder-network

volumes:
  postgres_data:

networks:
  tableorder-network:
    driver: bridge
